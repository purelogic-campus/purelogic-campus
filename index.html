<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PURE LOGIC • Campus Feed</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #ef4444;
      --success: #10b981;
      --admin: #f59e0b;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    .app-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        background-color: var(--card);
      }
      .app-card {
        border: none;
        border-radius: 0;
        box-shadow: none;
        min-height: 100vh;
        padding: 20px 16px;
        padding-top: calc(12px + env(safe-area-inset-top));
      }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .logo { font-weight: 800; font-size: 20px; letter-spacing: 1px; color: var(--primary); }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .points-badge { 
      background: rgba(59, 130, 246, 0.1); 
      color: var(--primary); 
      padding: 6px 12px; 
      border-radius: 20px; 
      font-size: 13px; 
      font-weight: 600; 
    }
    .points-badge.admin-badge { 
      background: rgba(245, 158, 11, 0.15); 
      color: var(--admin); 
      border: 1px solid rgba(245, 158, 11, 0.3); 
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.1);
      color: var(--accent);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-logout:active { transform: scale(0.95); }

    .hidden { display: none !important; }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      font-weight: 600;
      font-size: 16px;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #475569; }
    
    input, textarea {
      width: 100%;
      padding: 14px;
      margin: 8px 0 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: white;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .password-container {
      position: relative;
    }
    .password-toggle {
      position: absolute;
      right: 14px;
      top: 18px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      color: var(--text-muted);
    }

    .forgot-password {
      display: block;
      text-align: right;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
      margin-top: -10px;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .forgot-password:hover { text-decoration: underline; }
    
    .category-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
    }
    .cat-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: white;
      font-weight: 600;
    }
    
    .event-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .event-title { font-size: 16px; font-weight: 600; }
    .event-timer { 
      font-size: 11px; 
      background: rgba(239, 68, 68, 0.15); 
      color: var(--accent); 
      padding: 4px 8px; 
      border-radius: 8px; 
      font-weight: 600;
      white-space: nowrap;
    }
    .event-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
    
    .event-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 10px;
    }
    .btn-join {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-join:active { transform: scale(0.95); }

    .btn-delete {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 8px;
    }

    .chat-section {
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 10px;
    }
    .chat-messages {
      max-height: 100px;
      overflow-y: auto;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .chat-msg-item {
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 6px;
    }
    .chat-input-row {
      display: flex;
      gap: 6px;
    }
    .chat-input-row input {
      margin: 0;
      padding: 8px;
      font-size: 13px;
    }
    .btn-chat-send {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .msg-box {
      font-size: 13px;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }
    .msg-error { background: rgba(239,68,68,0.15); color: var(--accent); }
    .msg-success { background: rgba(16,185,129,0.15); color: var(--success); }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="logo">PURE LOGIC</div>
    <div class="header-right">
      <div class="points-badge" id="score">0 P</div>
      <button class="btn-logout hidden" id="logout-btn" onclick="resetUser()" title="Abmelden">🚪 Logout</button>
    </div>
  </div>

  <!-- STEP 1: AUTH GATE (LOGIN / SIGNUP) -->
  <div id="auth-gate">
    <h2 style="margin-bottom: 6px;">Willkommen</h2>
    <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 14px;">Melde dich an oder registriere dich:</p>
    
    <div id="auth-msg" class="msg-box hidden"></div>

    <label style="font-size: 12px; color: var(--text-muted);">E-Mail-Adresse:</label>
    <input type="email" id="email" placeholder="deine.mail@uni.at">
    
    <label style="font-size: 12px; color: var(--text-muted);">Passwort:</label>
    <div class="password-container">
      <input type="password" id="password" placeholder="Dein Passwort">
      <button type="button" class="password-toggle" id="toggle-pw-btn" onclick="togglePasswordVisibility()">👁️</button>
    </div>
    
    <a class="forgot-password" onclick="handleForgotPassword()">Passwort vergessen?</a>

    <button class="btn" onclick="handleLogin()">Einloggen</button>
    <button class="btn btn-secondary" onclick="handleSignup()">Konto registrieren</button>
  </div>

  <!-- STEP 2: LIVE FEED -->
  <div id="main-feed" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
      <h3>Spontane Treffen</h3>
      <button class="btn" style="width:auto; margin-top:0; padding: 8px 14px; font-size: 13px;" onclick="toggleModal(true)">+ Erstellen</button>
    </div>

    <!-- FEED CATEGORY FILTERS -->
    <div class="category-group" id="filter-group">
      <div class="cat-pill active" onclick="setFilter(this, 'Alle')">Alle</div>
      <div class="cat-pill" onclick="setFilter(this, '☕ Kaffee')">☕ Kaffee</div>
      <div class="cat-pill" onclick="setFilter(this, '📖 Lernen')">📖 Lernen</div>
      <div class="cat-pill" onclick="setFilter(this, '🍺 Bier')">🍺 Bier</div>
      <div class="cat-pill" onclick="setFilter(this, '🏀 Sport')">🏀 Sport</div>
    </div>

    <div id="feed-list">
      <p style="color: var(--text-muted); font-size: 14px;">Lade Treffen...</p>
    </div>
  </div>

  <!-- MODAL: TREFFEN ERSTELLEN -->
  <div id="create-modal" class="hidden">
    <h3>Neues Treffen anbieten</h3>
    
    <label style="font-size: 12px; color: var(--text-muted); margin-top: 12px; display: block;">Kategorie wählen:</label>
    <div class="category-group" id="create-category-group">
      <div class="cat-pill active" onclick="selectCreateCategory(this, '☕ Kaffee')">☕ Kaffee</div>
      <div class="cat-pill" onclick="selectCreateCategory(this, '📖 Lernen')">📖 Lernen</div>
      <div class="cat-pill" onclick="selectCreateCategory(this, '🍺 Bier')">🍺 Bier</div>
      <div class="cat-pill" onclick="selectCreateCategory(this, '🏀 Sport')">🏀 Sport</div>
    </div>

    <input type="text" id="title" placeholder="Titel (z. B. Pause im Hof)">
    <input type="text" id="location" placeholder="Ort (z. B. Votivpark / Bib OG2)">
    <button class="btn" onclick="submitEvent()">Veröffentlichen (+20 P)</button>
    <button class="btn btn-secondary" onclick="toggleModal(false)">Abbrechen</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ykyfdrnkxqfvhasfbehe.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_2bLjUm02NS5XDAJMvVDgTA_rSzQKZAe';
  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const MASTER_ADMIN_EMAIL = 'admin@purelogic.app';
  const MASTER_ADMIN_PASS = 'Doschi08021991';

  let currentUni = 'PureLogic-Network';
  let currentUserEmail = localStorage.getItem('campus_email') || '';
  let userPoints = 0;
  let selectedCategory = '☕ Kaffee';
  let activeFilter = 'Alle';
  let allEventsCache = [];

  window.addEventListener('DOMContentLoaded', async () => {
    if (currentUserEmail) {
      document.getElementById('logout-btn').classList.remove('hidden');
      if (currentUserEmail === MASTER_ADMIN_EMAIL) {
        userPoints = 9999;
        setupAdminUI();
        document.getElementById('auth-gate').classList.add('hidden');
        document.getElementById('main-feed').classList.remove('hidden');
        initAppRealtime();
        loadEvents();
      } else {
        const { data } = await _supabase.from('users').select('*').eq('email', currentUserEmail).maybeSingle();
        if (data) {
          userPoints = data.points || 0;
          updatePointsDisplay();
          document.getElementById('auth-gate').classList.add('hidden');
          document.getElementById('main-feed').classList.remove('hidden');
          initAppRealtime();
          loadEvents();
        } else {
          resetUser(false);
        }
      }
    }
  });

  function initAppRealtime() {
    _supabase
      .channel('public:live_events')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'live_events' }, payload => {
        loadEvents();
      })
      .subscribe();
  }

  function togglePasswordVisibility() {
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-pw-btn');
    if (pwInput.type === 'password') {
      pwInput.type = 'text';
      toggleBtn.innerText = '🙈';
    } else {
      pwInput.type = 'password';
      toggleBtn.innerText = '👁️';
    }
  }

  function selectCreateCategory(element, cat) {
    document.querySelectorAll('#create-category-group .cat-pill').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    selectedCategory = cat;
  }

  function setFilter(element, filterCat) {
    document.querySelectorAll('#filter-group .cat-pill').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    activeFilter = filterCat;
    renderEvents();
  }

  function showMessage(text, isError = true) {
    const box = document.getElementById('auth-msg');
    box.innerText = text;
    box.className = `msg-box ${isError ? 'msg-error' : 'msg-success'}`;
    box.classList.remove('hidden');
  }

  async function handleLogin() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      return showMessage('Bitte E-Mail und Passwort eingeben.');
    }

    if (email === MASTER_ADMIN_EMAIL && password === MASTER_ADMIN_PASS) {
      currentUserEmail = email;
      localStorage.setItem('campus_email', currentUserEmail);
      userPoints = 9999;
      setupAdminUI();
      document.getElementById('logout-btn').classList.remove('hidden');
      document.getElementById('auth-gate').classList.add('hidden');
      document.getElementById('main-feed').classList.remove('hidden');
      initAppRealtime();
      loadEvents();
      return;
    }

    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) {
      return showMessage('Login fehlgeschlagen: ' + error.message);
    }

    currentUserEmail = email;
    localStorage.setItem('campus_email', currentUserEmail);
    document.getElementById('logout-btn').classList.remove('hidden');

    let { data: existingUser } = await _supabase.from('users').select('*').eq('email', currentUserEmail).maybeSingle();
    if (!existingUser) {
      await _supabase.from('users').insert([{ email: currentUserEmail, university: 'Test-Campus', points: 10 }]);
      userPoints = 10;
    } else {
      userPoints = existingUser.points || 0;
    }

    updatePointsDisplay();
    document.getElementById('auth-gate').classList.add('hidden');
    document.getElementById('main-feed').classList.remove('hidden');
    initAppRealtime();
    loadEvents();
  }

  async function handleSignup() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      return showMessage('Bitte E-Mail und Passwort für die Registrierung eingeben.');
    }

    const { data, error } = await _supabase.auth.signUp({ email, password });
    if (error) {
      return showMessage('Registrierung fehlgeschlagen: ' + error.message);
    }

    showMessage('Registrierung erfolgreich! Bitte überprüfe dein E-Mail-Postfach für den Bestätigungslink.', false);
  }

  async function handleForgotPassword() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    if (!email) {
      return showMessage('Bitte gib oben deine E-Mail-Adresse ein, um das Passwort zurückzusetzen.');
    }

    const { error } = await _supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.href,
    });

    if (error) {
      return showMessage('Fehler: ' + error.message);
    }

    showMessage('Eine E-Mail zum Zurücksetzen des Passworts wurde gesendet!', false);
  }

  function setupAdminUI() {
    const badge = document.getElementById('score');
    badge.innerText = '⭐ Admin';
    badge.className = 'points-badge admin-badge';
  }

  async function fetchUserPoints() {
    if (!currentUserEmail || currentUserEmail === MASTER_ADMIN_EMAIL) return;
    const { data } = await _supabase.from('users').select('points').eq('email', currentUserEmail).maybeSingle();
    if (data && data.points !== undefined) {
      userPoints = data.points;
    }
    updatePointsDisplay();
  }

  async function addPoints(amount) {
    if (currentUserEmail === MASTER_ADMIN_EMAIL) return;
    userPoints += amount;
    updatePointsDisplay();
    await _supabase.from('users').update({ points: userPoints }).eq('email', currentUserEmail);
  }

  function updatePointsDisplay() {
    if (currentUserEmail === MASTER_ADMIN_EMAIL) {
      setupAdminUI();
      return;
    }
    document.getElementById('score').innerText = `${userPoints} P`;
  }

  function resetUser(ask = true) {
    if(!ask || confirm('Möchtest du dich abmelden?')) {
      localStorage.removeItem('campus_email');
      _supabase.auth.signOut();
      location.reload();
    }
  }

  function toggleModal(show) {
    if(show) {
      document.getElementById('main-feed').classList.add('hidden');
      document.getElementById('create-modal').classList.remove('hidden');
    } else {
      document.getElementById('create-modal').classList.add('hidden');
      document.getElementById('main-feed').classList.remove('hidden');
    }
  }

  async function submitEvent() {
    const title = document.getElementById('title').value;
    const location = document.getElementById('location').value;
    if(!title || !location) return alert('Bitte alle Felder ausfüllen');

    const expiresAt = new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString();

    const { error } = await _supabase.from('live_events').insert([
      { 
        title: title, 
        location: location, 
        category: selectedCategory, 
        university: currentUserEmail === MASTER_ADMIN_EMAIL ? 'Master-Admin' : currentUni,
        expires_at: expiresAt,
        joins_count: 0,
        chats: []
      }
    ]);

    if (error) {
      alert('Fehler beim Erstellen: ' + error.message);
      return;
    }

    await addPoints(20); // 20 Punkte fürs Erstellen eines Treffens

    document.getElementById('title').value = '';
    document.getElementById('location').value = '';
    toggleModal(false);
    loadEvents();
  }

  async function joinEvent(id, currentJoins) {
    const safeJoins = (currentJoins === null || currentJoins === undefined || isNaN(currentJoins)) ? 0 : Number(currentJoins);
    const nextCount = safeJoins + 1;

    const { error } = await _supabase
      .from('live_events')
      .update({ joins_count: nextCount })
      .eq('id', id);

    if (error) {
      alert('Supabase Fehler: ' + error.message);
    } else {
      await addPoints(10); // 10 Punkte fürs Teilnehmen
      loadEvents();
    }
  }

  async function sendChat(id, existingChats) {
    const inputField = document.getElementById(`chat-input-${id}`);
    const text = inputField.value.trim();
    if (!text) return;

    const shortName = currentUserEmail.split('@')[0];
    const newMsg = { user: shortName, text: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
    
    const chatsArray = Array.isArray(existingChats) ? existingChats : [];
    chatsArray.push(newMsg);

    const { error } = await _supabase
      .from('live_events')
      .update({ chats: chatsArray })
      .eq('id', id);

    if (error) {
      alert('Fehler beim Senden: ' + error.message);
    } else {
      inputField.value = '';
      loadEvents();
    }
  }

  async function deleteEvent(id) {
    if (!confirm('Möchtest du dieses Treffen als Admin wirklich löschen?')) return;

    const { error } = await _supabase
      .from('live_events')
      .delete()
      .eq('id', id);

    if (error) {
      alert('Fehler beim Löschen: ' + error.message);
    } else {
      loadEvents();
    }
  }

  function getTimeRemaining(expiresAt) {
    const total = Date.parse(expiresAt) - Date.parse(new Date());
    if (total <= 0) return 'Abgelaufen';
    const minutes = Math.floor((total / 1000 / 60) % 60);
    const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
    return `noch ${hours > 0 ? hours + ' Std ' : ''}${minutes} Min`;
  }

  async function loadEvents() {
    if (currentUserEmail !== MASTER_ADMIN_EMAIL) {
      await fetchUserPoints();
    }
    const nowISO = new Date().toISOString();
    
    const { data, error } = await _supabase
      .from('live_events')
      .select('*')
      .gt('expires_at', nowISO)
      .order('created_at', { ascending: false });

    if (error) {
      console.error(error);
      return;
    }

    allEventsCache = data || [];
    renderEvents();
  }

  function renderEvents() {
    const list = document.getElementById('feed-list');
    
    let filtered = allEventsCache;
    if (activeFilter !== 'Alle') {
      filtered = allEventsCache.filter(e => e.category === activeFilter);
    }

    if (!filtered || filtered.length === 0) {
      list.innerHTML = '<p style="color: var(--text-muted); font-size: 14px; text-align: center; padding: 20px 0;">Keine Treffen in dieser Kategorie gefunden.</p>';
      return;
    }

    const isAdmin = (currentUserEmail === MASTER_ADMIN_EMAIL);

    list.innerHTML = filtered.map(e => {
      const count = (e.joins_count === null || e.joins_count === undefined) ? 0 : e.joins_count;
      const chats = Array.isArray(e.chats) ? e.chats : [];
      
      return `
        <div class="event-card">
          <div class="event-header">
            <div class="event-title">${e.category || '📍'} ${e.title}</div>
            <div class="event-timer">⏱️ ${getTimeRemaining(e.expires_at)}</div>
          </div>
          <div class="event-meta">${e.location} • <span style="color:var(--primary);">${e.university || 'Campus'}</span></div>
          
          <div class="event-footer">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span style="font-size: 12px; color: var(--text-muted);">👥 ${count} am Start</span>
              ${isAdmin ? `<button class="btn-delete" onclick="deleteEvent('${e.id}')">🗑️ Löschen</button>` : ''}
            </div>
            <button class="btn-join" onclick="joinEvent('${e.id}', ${count})">🙋‍♂️ Bin dabei!</button>
          </div>

          <!-- EVENT CHAT / DETAILS -->
          <div class="chat-section">
            <div class="chat-messages" id="chat-box-${e.id}">
              ${chats.length === 0 ? '<div style="font-style:italic;">Noch keine Absprachen. Schreib etwas!</div>' : 
                chats.map(c => `<div class="chat-msg-item"><b>${c.user}</b> (${c.time}): ${c.text}</div>`).join('')}
            </div>
            <div class="chat-input-row">
              <input type="text" id="chat-input-${e.id}" placeholder="Kurze Nachricht an Teilnehmer..." onkeydown="if(event.key==='Enter') sendChat('${e.id}', ${JSON.stringify(chats).replace(/"/g, '&quot;')})">
              <button class="btn-chat-send" onclick="sendChat('${e.id}', ${JSON.stringify(chats).replace(/"/g, '&quot;')})">Senden</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }
</script>

</body>
</html>
